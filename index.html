<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>rochaOS — Luis Rocha · Cloud Infrastructure Engineer</title>
  <meta name="description" content="Interactive terminal portfolio of Luis Rocha — Infrastructure & Automation Engineer based in Komaki, Japan. AWS SAA-C03 in progress. Open to remote roles and EU relocation." />
  <meta name="theme-color" content="#0c0a0d" />
  <meta name="color-scheme" content="dark" />

  <!-- Open Graph -->
  <meta property="og:title" content="rochaOS — Luis Rocha" />
  <meta property="og:description" content="Infrastructure & Automation Engineer · 17 years technical · AWS SAA-C03 in progress · Komaki, Japan · open to EU/remote" />
  <meta property="og:type" content="website" />

  <!-- Inline SVG favicon: terminal prompt style -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230c0a0d'/%3E%3Cpath d='M5 9 L11 16 L5 23' stroke='%23c4a7e7' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='14' y='20' width='12' height='2.5' rx='1' fill='%237dd3a8'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230c0a0d'/%3E%3Cpath d='M5 9 L11 16 L5 23' stroke='%23c4a7e7' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='14' y='20' width='12' height='2.5' rx='1' fill='%237dd3a8'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0c0a0d;
      --bg-soft: #14101a;
      --text: #e8e6e3;
      --text-dim: #8a8590;
      --text-faint: #4a4452;

      --user: #c4a7e7;
      --host: #7dd3a8;
      --path: #6ba3e8;
      --punct: #6a6373;
      --accent: #c4a7e7;
      --cursor: #e8e6e3;

      --dir: #6ba3e8;
      --file: #e8e6e3;
      --exec: #7dd3a8;
      --error: #e07b7b;
      --warning: #e0c87b;
      --info: #c4a7e7;
      --string: #a5d99a;
      --number: #e0c87b;
      --key: #6ba3e8;

      --font-mono: 'JetBrains Mono', 'Courier New', monospace;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.92' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.025;
      pointer-events: none;
      z-index: 100;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.4) 100%);
      pointer-events: none;
      z-index: 99;
    }

    #terminal {
      position: fixed;
      inset: 0;
      padding: 24px 28px;
      overflow-y: auto;
      overflow-x: hidden;
      cursor: text;
    }

    #terminal::-webkit-scrollbar { width: 6px; }
    #terminal::-webkit-scrollbar-track { background: var(--bg); }
    #terminal::-webkit-scrollbar-thumb { background: var(--text-faint); border-radius: 3px; }

    #history { white-space: pre-wrap; word-break: break-word; }

    .line { white-space: pre-wrap; word-break: break-word; }

    .prompt-line {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
    }

    .ps-user { color: var(--user); font-weight: 500; }
    .ps-at { color: var(--punct); }
    .ps-host { color: var(--host); font-weight: 500; }
    .ps-colon { color: var(--punct); }
    .ps-path { color: var(--path); }
    .ps-dollar { color: var(--text); margin-right: 8px; }

    .cmd-text { color: var(--text); }

    .out-dir   { color: var(--dir); font-weight: 500; }
    .out-file  { color: var(--file); }
    .out-exec  { color: var(--exec); }
    .out-error { color: var(--error); }
    .out-warn  { color: var(--warning); }
    .out-info  { color: var(--info); }
    .out-dim   { color: var(--text-dim); }
    .out-faint { color: var(--text-faint); }
    .out-accent{ color: var(--accent); font-weight: 500; }

    /* Clickable command links inside outputs */
    .cmd-link {
      color: var(--exec);
      cursor: pointer;
      border-bottom: 1px dotted var(--text-faint);
      transition: color 0.12s, border-color 0.12s;
    }
    .cmd-link:hover {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .json-key    { color: var(--key); }
    .json-string { color: var(--string); }
    .json-number { color: var(--number); }
    .json-bool   { color: var(--accent); }
    .json-null   { color: var(--error); }
    .json-punct  { color: var(--punct); }

    #input-row {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      padding-bottom: 40vh;
    }

    #cmd-input {
      flex: 1;
      min-width: 100px;
      background: transparent;
      border: none;
      outline: none;
      color: transparent;
      caret-color: transparent;
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.55;
      padding: 0;
    }

    #cursor {
      display: inline-block;
      width: 0.6em;
      height: 1.05em;
      background: var(--cursor);
      vertical-align: text-bottom;
      animation: blink 1.05s step-end infinite;
      position: relative;
    }
    /* When the cursor is in the middle, show the char under it */
    #cursor::after {
      content: attr(data-char);
      position: absolute;
      left: 0; top: 0;
      width: 100%; height: 100%;
      color: var(--bg);
      text-align: center;
      line-height: 1.05em;
      pointer-events: none;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    /* Selection: use accent color, theme-aware */
    ::selection {
      background: var(--accent);
      color: var(--bg);
    }
    ::-moz-selection {
      background: var(--accent);
      color: var(--bg);
    }

    /* Smooth fade-in for new content lines (subtle, doesn't slow down animations) */
    .line {
      animation: lineFadeIn 0.08s ease-out;
    }
    @keyframes lineFadeIn {
      from { opacity: 0; transform: translateY(2px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Smooth boot → menu → shell transitions */
    #menu-screen, #terminal {
      animation: screenFadeIn 0.25s ease-out;
    }
    @keyframes screenFadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* Subtle scrollbar across the app */
    *::-webkit-scrollbar { width: 6px; height: 6px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background: var(--text-faint); border-radius: 3px; }
    *::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

    /* Disable line fadeIn during boot (boot has its own animation) */
    #boot-content .b-line { animation: bootFadeIn 0.04s linear both; }

    #input-mirror-before, #input-mirror-after {
      color: var(--text);
      white-space: pre;
    }

    /* ─── BOOT SCREEN ──────────────────────────────────────────── */
    #boot-screen {
      position: fixed;
      inset: 0;
      background: #000;
      color: #c8c4ce;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.5;
      padding: 28px 32px;
      overflow: hidden;
      z-index: 200;
    }

    #boot-content {
      white-space: pre-wrap;
      word-break: break-word;
    }

    #boot-content .b-line {
      animation: bootFadeIn 0.04s linear both;
    }

    @keyframes bootFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .b-ok    { color: #7dd3a8; }
    .b-warn  { color: #e0c87b; }
    .b-fail  { color: #e07b7b; }
    .b-info  { color: #c4a7e7; }
    .b-time  { color: #6a6373; }
    .b-tag   { color: #6ba3e8; }
    .b-dim   { color: #6a6373; }
    .b-bright{ color: #e8e6e3; }
    .b-bracket-l, .b-bracket-r { color: #6a6373; }
    .b-logo  { color: #c4a7e7; }

    #boot-skip-hint {
      position: fixed;
      bottom: 18px;
      right: 24px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: #4a4452;
      letter-spacing: 0.05em;
    }
    #boot-skip-hint kbd {
      padding: 1px 5px;
      border: 1px solid #4a4452;
      border-radius: 2px;
      font-family: inherit;
      font-size: 10px;
      color: #6a6373;
    }

    /* ─── EDITOR FULLSCREEN OVERLAY ─────────────────────────── */
    #editor-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.45;
      z-index: 250;
      display: flex;
      flex-direction: column;
    }
    #editor-content {
      flex: 1;
      padding: 12px 16px;
      overflow: hidden;
      white-space: pre;
      color: var(--text);
    }
    #editor-content .ed-line { white-space: pre; }
    #editor-content .ed-tilde { color: var(--text-faint); }
    #editor-content .ed-text  { color: var(--text); }
    #editor-content .ed-warn  { color: var(--warning); }
    #editor-content .ed-info  { color: var(--info); }
    #editor-content .ed-dim   { color: var(--text-dim); }
    #editor-content .ed-exec  { color: var(--exec); }

    #editor-statusbar {
      padding: 4px 16px;
      background: var(--bg-soft);
      color: var(--text);
      font-size: 12px;
      border-top: 1px solid var(--text-faint);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    #editor-statusbar .ed-mode   { color: var(--accent); font-weight: 500; }
    #editor-statusbar .ed-file   { color: var(--text); }
    #editor-statusbar .ed-hint   { color: var(--text-dim); margin-left: auto; font-size: 11px; }
    #editor-statusbar .ed-cmd    { color: var(--exec); font-family: var(--font-mono); }

    #editor-input {
      width: 100%;
      background: var(--bg-soft);
      color: var(--text);
      border: none;
      border-top: 1px solid var(--text-faint);
      outline: none;
      padding: 6px 16px;
      font-family: var(--font-mono);
      font-size: 14px;
    }
    @media (max-width: 640px) {
      #editor-content { font-size: 12px; padding: 10px 12px; }
      #editor-input { font-size: 16px; }
    }

    /* ─── MENU SCREEN ──────────────────────────────────────────── */
    #menu-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.65;
      padding: 28px 32px;
      overflow-y: auto;
      z-index: 150;
    }

    #menu-content {
      max-width: 880px;
      margin: 0 auto;
    }

    .m-banner-line { color: var(--accent); }
    .m-rule        { color: var(--text-faint); }
    .m-label       { color: var(--text-dim); }
    .m-value       { color: var(--text); }
    .m-status-ok   { color: var(--exec); }
    .m-status-warn { color: var(--warning); }
    .m-section     { color: var(--info); margin-top: 18px; margin-bottom: 4px; letter-spacing: 0.05em; }

    .m-option {
      display: flex;
      align-items: baseline;
      gap: 14px;
      padding: 5px 8px;
      cursor: pointer;
      border-radius: 2px;
      transition: background 0.12s;
      margin: 1px 0;
    }
    .m-option:hover, .m-option.is-active {
      background: var(--bg-soft);
    }
    .m-option:hover .m-num, .m-option.is-active .m-num {
      color: var(--accent);
    }

    .m-num {
      color: var(--info);
      min-width: 36px;
      font-weight: 500;
    }
    .m-num-bracket { color: var(--text-faint); }
    .m-title {
      color: var(--text);
    }
    .m-desc {
      color: var(--text-dim);
      margin-left: auto;
      font-size: 11px;
    }

    .m-prompt {
      margin-top: 22px;
      padding-top: 14px;
      border-top: 1px solid var(--text-faint);
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .m-prompt-label {
      color: var(--text-dim);
    }
    .m-prompt-input {
      flex: 1;
      display: flex;
      align-items: baseline;
      position: relative;
      min-width: 60px;
    }
    #menu-input-mirror-before, #menu-input-mirror-after {
      color: var(--text);
      white-space: pre;
    }
    #menu-cursor {
      display: inline-block;
      width: 0.6em;
      height: 1.05em;
      background: var(--cursor);
      vertical-align: text-bottom;
      animation: blink 1.05s step-end infinite;
    }
    #menu-cmd-input {
      flex: 1;
      min-width: 30px;
      background: transparent;
      border: none;
      outline: none;
      color: transparent;
      caret-color: transparent;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.65;
      padding: 0;
    }

    .m-error {
      color: var(--error);
      margin-top: 8px;
    }
    .m-info {
      color: var(--text-dim);
      font-size: 11px;
      margin-top: 6px;
    }

    @media (max-width: 640px) {
      #menu-screen { padding-bottom: 30px; font-size: 12px; }
      .m-desc { display: none; }
      .m-option { padding: 9px 8px; }

      /* iOS: any input <16px triggers auto-zoom on focus. Force 16px. */
      #cmd-input, #menu-cmd-input {
        font-size: 16px !important;
      }

      /* Keep visible mirror text at terminal size */
      #input-mirror-before, #input-mirror-after {
        font-size: 13px;
      }
      #menu-input-mirror-before, #menu-input-mirror-after {
        font-size: 12px;
      }

      /* Smaller terminal padding on mobile */
      #terminal { padding: 16px 14px; font-size: 13px; }
      #boot-screen { padding: 14px 16px; font-size: 11px; }

      /* Boot lines wrap nicely on mobile */
      #boot-content .b-line { font-size: 11px; }

      /* MOTD logo: hide complex Unicode block art on small screens, show simpler version */
      .motd-logo-desktop { display: none; }
      .motd-logo-mobile  { display: block; }
    }

    @media (min-width: 641px) {
      .motd-logo-desktop { display: block; }
      .motd-logo-mobile  { display: none; }
    }

    /* ─── MENU OUTPUT OVERLAY ─────────────────────────────── */
    #menu-output {
      margin-top: 18px;
      border-top: 1px solid var(--text-faint);
      padding-top: 16px;
      display: none;
    }
    #menu-output.is-open {
      display: block;
    }
    .mo-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .mo-title {
      color: var(--accent);
      font-weight: 500;
      letter-spacing: 0.04em;
    }
    .mo-cmd {
      color: var(--text-dim);
      font-size: 11px;
    }
    .mo-back {
      margin-left: auto;
      color: var(--text-dim);
      cursor: pointer;
      padding: 4px 10px;
      border: 1px solid var(--text-faint);
      border-radius: 2px;
      transition: all 0.12s;
      font-size: 11px;
      letter-spacing: 0.04em;
      background: transparent;
      font-family: inherit;
    }
    .mo-back:hover {
      color: var(--text);
      border-color: var(--text-dim);
      background: var(--bg-soft);
    }
    .mo-body {
      max-height: 60vh;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 8px;
    }
    .mo-body::-webkit-scrollbar { width: 4px; height: 4px; }
    .mo-body::-webkit-scrollbar-track { background: transparent; }
    .mo-body::-webkit-scrollbar-thumb { background: var(--text-faint); border-radius: 2px; }
    /* Lines wrap in overlay so ASCII boxes don't overflow */
    .mo-body .line { white-space: pre-wrap; word-break: break-word; }

    #input-wrapper {
      flex: 1;
      display: flex;
      align-items: baseline;
      position: relative;
    }

    /* ─── PRINT STYLES ────────────────────────────────────── */
    /* If anyone hits print, give them a clean readable document */
    @media print {
      body { background: white; color: black; }
      body::before, body::after { display: none; }
      #boot-screen, #menu-screen, #editor-overlay { display: none !important; }
      #terminal {
        position: static;
        padding: 20px;
        overflow: visible;
        height: auto;
        background: white;
        color: black;
        font-size: 11px;
      }
      #input-row { display: none; }
      .line, .ps-user, .ps-host, .ps-path, .ps-dollar,
      .out-file, .out-info, .out-exec, .out-accent, .out-warn,
      .out-dim, .out-faint, .cmd-text {
        color: black !important;
      }
      .out-error { color: #b00 !important; }
      #cursor { display: none; }
      .prompt-line { color: #333 !important; }
      a { color: #06c !important; text-decoration: underline !important; }
    }
  </style>
</head>
<body>
  <div id="boot-screen">
    <div id="boot-content"></div>
    <div id="boot-skip-hint">press <kbd>Enter</kbd> · <kbd>Esc</kbd> · <kbd>s</kbd> to skip</div>
  </div>

  <div id="menu-screen" style="display:none">
    <div id="menu-content"></div>
  </div>

  <div id="editor-overlay" style="display:none">
    <div id="editor-content"></div>
    <div id="editor-statusbar"></div>
    <input id="editor-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
  </div>

  <div id="terminal" style="display:none">
    <div id="history"></div>

    <div id="input-row">
      <span class="prompt-line" id="prompt">
        <span class="ps-user">luis</span><span class="ps-at">@</span><span class="ps-host">rochaOS</span><span class="ps-colon">:</span><span class="ps-path" id="ps-path">~</span><span class="ps-dollar">$</span>
      </span>
      <div id="input-wrapper">
        <span id="input-mirror-before"></span><span id="cursor"></span><span id="input-mirror-after"></span>
        <input id="cmd-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
      </div>
    </div>
  </div>

  <script>
  // ─── EARLY THEME LOADER ───────────────────────────────────────────────────
  // Apply saved theme BEFORE main script runs to avoid flash of default theme.
  // Theme variable definitions are duplicated here (small) to run synchronously.
  (function () {
    try {
      const key = localStorage.getItem('rochaOS:theme');
      if (!key) return;
      const VARS = {
        'debian': null, // default, no override needed
        'solarized-dark': {'--bg':'#002b36','--bg-soft':'#073642','--text':'#93a1a1','--text-dim':'#586e75','--text-faint':'#465458','--user':'#268bd2','--host':'#859900','--path':'#2aa198','--punct':'#586e75','--accent':'#cb4b16','--cursor':'#93a1a1','--dir':'#2aa198','--file':'#93a1a1','--exec':'#859900','--error':'#dc322f','--warning':'#b58900','--info':'#268bd2','--string':'#859900','--number':'#b58900','--key':'#268bd2'},
        'gruvbox': {'--bg':'#282828','--bg-soft':'#3c3836','--text':'#ebdbb2','--text-dim':'#a89984','--text-faint':'#7c6f64','--user':'#fabd2f','--host':'#b8bb26','--path':'#83a598','--punct':'#928374','--accent':'#fe8019','--cursor':'#ebdbb2','--dir':'#83a598','--file':'#ebdbb2','--exec':'#b8bb26','--error':'#fb4934','--warning':'#fabd2f','--info':'#d3869b','--string':'#b8bb26','--number':'#d3869b','--key':'#83a598'},

`# /opt/docker/compose.yml (excerpt — 12 of 15+ services)
# generated from real homelab · sensitive values redacted

version: "3.8"

networks:
  homelab_net:
    driver: bridge

services:
  nginx:
    image: nginx:alpine
    container_name: nginx-rp
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/conf:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    restart: unless-stopped
    networks: [homelab_net]

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: \${GRAFANA_PW}
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    command: -config.file=/etc/loki/loki-config.yml
    restart: unless-stopped

  vector:
    image: timberio/vector:latest-alpine
    volumes:
      - ./vector/vector.toml:/etc/vector/vector.toml:ro
      - /var/log:/var/log:ro
    restart: unless-stopped

  vaultwarden:
    image: vaultwarden/server:latest
    environment:
      DOMAIN: https://vault.rochaluis.com
      SIGNUPS_ALLOWED: "false"
    volumes:
      - vaultwarden_data:/data
    restart: unless-stopped

  jellyfin:
    image: jellyfin/jellyfin:latest
    volumes:
      - jellyfin_config:/config
      - /mnt/media:/media:ro
    devices:
      - /dev/dri:/dev/dri  # hardware transcoding
    restart: unless-stopped

  adguardhome:
    image: adguard/adguardhome:latest
    network_mode: host
    volumes:
      - adguard_work:/opt/adguardhome/work
      - adguard_conf:/opt/adguardhome/conf
    restart: unless-stopped

  matrix-synapse:
    image: matrixdotorg/synapse:latest
    volumes:
      - synapse_data:/data
    environment:
      SYNAPSE_SERVER_NAME: rochaluis.com
      SYNAPSE_REPORT_STATS: "no"
    restart: unless-stopped

    image: gcr.io/cadvisor/cadvisor:latest
    volumes:

      - /var/run:/var/run:ro

      - /var/lib/docker/:/var/lib/docker:ro

volumes:
  prometheus_data:
  grafana_data:
  vaultwarden_data:
  jellyfin_config:
  adguard_work:
  adguard_conf:

  function highlightJson(line) {
    let out = ''; let i = 0;
    while (i < line.length) {
      const c = line[i];
      if (c === '"') {
        let j = i + 1;
        while (j < line.length && line[j] !== '"') {
          if (line[j] === '\\') j += 2; else j++;
        }
        const str = line.slice(i, j + 1);
        let k = j + 1;
        while (k < line.length && line[k] === ' ') k++;
        const isKey = line[k] === ':';
        out += `<span class="${isKey ? 'json-key' : 'json-string'}">${esc(str)}</span>`;
        i = j + 1; continue;
      }
      if (/[\d-]/.test(c) && (i === 0 || /[\s,:[\]{}]/.test(line[i-1]))) {
        let j = i;
        while (j < line.length && /[\d.eE+-]/.test(line[j])) j++;
        out += `<span class="json-number">${esc(line.slice(i, j))}</span>`;
        i = j; continue;
      }
      if (line.slice(i, i+5) === 'false') { out += `<span class="json-bool">false</span>`; i += 5; continue; }
      if (line.slice(i, i+4) === 'true') { out += `<span class="json-bool">true</span>`; i += 4; continue; }
      if (line.slice(i, i+4) === 'null') { out += `<span class="json-null">null</span>`; i += 4; continue; }
      if ('{}[],:'.includes(c)) {
        out += `<span class="json-punct">${esc(c)}</span>`; i++; continue;
      }
      out += esc(c); i++;
    }
    return out;
  }

      if (raw === '') { appendBlank(); continue; }
      if (/^\s*#/.test(raw)) { appendHTML(`<span class="out-dim">${esc(raw)}</span>`); continue; }
      const m = raw.match(/^(\s*)([^:#\s][^:]*?):(\s*)(.*)$/);

        let valHtml = '';
        if (val.startsWith('"') || val.startsWith("'")) valHtml = `<span class="json-string">${esc(val)}</span>`;
        else if (/^\d/.test(val)) valHtml = `<span class="json-number">${esc(val)}</span>`;

        appendHTML(`${esc(indent)}<span class="json-key">${esc(key)}</span><span class="json-punct">:</span>${esc(sp)}${valHtml}`);

      if (/^\s*-\s/.test(raw)) {

  function getCurrentThemeKey() {
    try {
      const saved = localStorage.getItem(THEME_KEY_PERSIST);
      if (saved && THEMES[saved]) return saved;
    } catch (e) {}
    return 'debian';
  }

  function applyTheme(key) {
    const t = THEMES[key];
    if (!t) return false;
    const root = document.documentElement;
    for (const [k, v] of Object.entries(t.vars)) {
      root.style.setProperty(k, v);
    }
    try { localStorage.setItem(THEME_KEY_PERSIST, key); } catch (e) {}
    return true;
  }

      const seedF = (i, t, base, range) =>

        HOMESERVER_CONTAINERS.forEach((c, i) => {

          const memMB = Math.floor(seedF(i, tick, c.name === 'prometheus' ? 412 : c.name === 'jellyfin' ? 248 : c.name === 'matrix-synapse' ? 156 : c.name === 'wordpress' ? 112 : 64, 30));

          const blkIn = (Math.random() * 50 + 10).toFixed(0);

          rowDivs[i].innerHTML =
            '<span class="out-file">' + c.name.padEnd(20) + '</span>' +
            '<span class="' + cpuClass + '">' + (cpu.toFixed(2) + '%').padStart(8) + '</span>   ' +

            '<span class="out-dim">' + blkIn + 'kB/' + blkOut + 'kB</span>';
        });
        softScroll();
        tick++;
        if (tick < maxTicks) setTimeout(update, 2000);

          appendHTML('<span class="out-dim">stats stream ended after ' + (maxTicks * 2) + 's · in real shell, runs forever</span>');

  // Setup editor overlay input handlers (runs once on init)
  function setupEditorOverlay() {
    const edInput = document.getElementById('editor-input');
    if (!edInput) return;

    edInput.addEventListener('keydown', (e) => {
      if (!editorActive) return;

      // Ctrl+X for nano = exit
      if (editorMode === 'nano' && e.ctrlKey && (e.key === 'x' || e.key === 'X')) {
        e.preventDefault();
        closeEditorOverlay('<span class="out-dim">[ saved... not really. it\'s read-only. ]</span>');
        return;
      }

      // Emacs: Ctrl+X (alone) closes; Ctrl+C also closes (interrupt)
      if (editorMode === 'emacs' && e.ctrlKey && (e.key === 'x' || e.key === 'X' || e.key === 'c' || e.key === 'C')) {
        e.preventDefault();
        closeEditorOverlay('<span class="out-dim">emacs closed. you escaped.</span>');
        return;
      }

      // Esc + clear input
      if (e.key === 'Escape') {
        e.preventDefault();
        edInput.value = '';
        return;
      }

      if (e.key === 'Enter') {
        e.preventDefault();
        const val = edInput.value.trim();
        edInput.value = '';

        if (editorMode === 'vim') {
          if (val === ':q' || val === ':q!' || val === ':wq' || val === ':qa' || val === ':qa!' || val === ':x') {
            closeEditorOverlay('<span class="out-exec">you escaped vim. you\'re among the elite.</span>');
            return;
          }
          if (val === ':help' || val === ':h') {
            // brief help
            const content = document.getElementById('editor-content');
            content.innerHTML +=
              '\n<span class="ed-info">commands you can use here:</span>' +
              '\n  <span class="ed-exec">:q</span>     <span class="ed-dim">quit</span>' +
              '\n  <span class="ed-exec">:q!</span>    <span class="ed-dim">quit no matter what</span>' +
              '\n  <span class="ed-exec">:wq</span>    <span class="ed-dim">save and quit (file is read-only here)</span>';
            return;
          }
          // Anything else: stay
          return;
        }

        if (editorMode === 'nano' || editorMode === 'emacs') {
          if (val === 'exit' || val === 'quit') {
            closeEditorOverlay('<span class="out-dim">' + esc(editorMode) + ' closed.</span>');
            return;
          }
          return;
        }
      }
    });
  }

  // ─── HISTORY EXPANSION (!N, !!) ────────────────────────────────────────────
  function expandHistory(line) {
    const trimmed = line.trim();
    if (trimmed === '!!') {
      return state.history.length > 0 ? state.history[state.history.length - 1] : null;
    }
    const m = trimmed.match(/^!(\d+)$/);
    if (m) {
      const idx = parseInt(m[1], 10) - 1;
      if (idx >= 0 && idx < state.history.length) return state.history[idx];
      return null;
    }
    return line;
  }

  // ─── TAB AUTOCOMPLETE ────────────────────────────────────────
  function listChildren(pathArr) {
    const node = walk(pathArr);
    if (!node || node.type !== 'dir') return [];
    return Object.keys(node.children).sort();
  }

  function commonPrefix(strs) {
    if (strs.length === 0) return '';
    let prefix = strs[0];
    for (let i = 1; i < strs.length; i++) {
      while (!strs[i].startsWith(prefix)) {
        prefix = prefix.slice(0, -1);
        if (prefix === '') return '';
      }
    }
    return prefix;
  }

  function tabComplete(value, doubleTab) {
    // Determine context: completing command (first token) or path (later token)
    const beforeCursor = value;
    const tokens = beforeCursor.split(/\s+/);
    const isCommandPos = tokens.length === 1;
    const last = tokens[tokens.length - 1];

    let candidates = [];
    let baseDir = state.cwd;
    let prefix = last;

    if (isCommandPos) {
      candidates = KNOWN_COMMANDS.filter(c => c.startsWith(last));
    } else {
      // Path completion. Split last token into dir + name prefix.
      let dirPart = '';
      let namePart = last;
      const lastSlash = last.lastIndexOf('/');
      if (lastSlash >= 0) {
        dirPart = last.slice(0, lastSlash + 1);
        namePart = last.slice(lastSlash + 1);
      }
      let resolveTarget;
      if (dirPart === '') {
        resolveTarget = state.cwd;
      } else {
        resolveTarget = resolvePath(dirPart);
      }
      const items = listChildren(resolveTarget);
      const matches = items.filter(n => n.startsWith(namePart));
      // Add trailing slash for dirs
      const targetNode = walk(resolveTarget);
      candidates = matches.map(n => {
        const child = targetNode && targetNode.type === 'dir' ? targetNode.children[n] : null;
        return child && child.type === 'dir' ? n + '/' : n;
      });
      prefix = namePart;
      // Reconstruct: replace last token with dirPart + completed
      var dirPrefix = dirPart;
    }

    if (candidates.length === 0) {
      return { newValue: value, listed: false };
    }

    if (candidates.length === 1) {
      const completed = candidates[0];
      let newLast;
      if (isCommandPos) {
        newLast = completed + ' ';
      } else {
        // path — only add space if not a directory
        newLast = dirPrefix + completed;
        if (!completed.endsWith('/')) newLast += ' ';
      }
      tokens[tokens.length - 1] = newLast;
      return { newValue: tokens.join(' '), listed: false };
    }

    // Multiple matches: extend to common prefix
    const cp = commonPrefix(candidates.map(c => c.replace(/\/$/, '')));
    const currentLast = isCommandPos ? last : last.slice(last.lastIndexOf('/') + 1);
    if (cp.length > currentLast.length) {
      let newLast;
      if (isCommandPos) {
        newLast = cp;
      } else {
        newLast = dirPrefix + cp;
      }
      tokens[tokens.length - 1] = newLast;
      return { newValue: tokens.join(' '), listed: false };
    }

    // Already at common prefix. On double-tab, list options
    if (doubleTab) {
      // Print current prompt + value, then candidates, then re-show prompt
      renderPromptHistoryLine(value);
      const cols = 4;
      const colWidth = Math.max(...candidates.map(c => c.length)) + 4;
      let line = '';
      candidates.forEach((c, i) => {
        const padded = c.padEnd(colWidth);
        const isDir = c.endsWith('/');
        const cls = isDir ? 'out-dir' : (c.endsWith('.json') || c.endsWith('.yml') ? 'out-warn' : (KNOWN_COMMANDS.includes(c) ? 'out-exec' : 'out-file'));
        line += `<span class="${cls}">${esc(padded)}</span>`;
        if ((i + 1) % cols === 0) {
          appendHTML(line); line = '';
        }
      });
      if (line) appendHTML(line);
      scrollToBottom();
      return { newValue: value, listed: true };
    }

    return { newValue: value, listed: false };
  }

  // ─── KEYDOWN HANDLER (Task 3) ─────────────────────────────────────────────
  input.addEventListener('keydown', (e) => {

    // Ctrl+L = clear
    if (e.ctrlKey && (e.key === 'l' || e.key === 'L')) {
      e.preventDefault();
      cmdClear();
      return;
    }

    // Ctrl+C = cancel current line
    if (e.ctrlKey && (e.key === 'c' || e.key === 'C')) {
      // Allow normal copy behavior if there's a selection
      const sel = window.getSelection();
      if (sel && sel.toString().length > 0) return;
      e.preventDefault();
      const cur = input.value;
      renderPromptHistoryLine(cur + '^C');
      input.value = '';
      updateMirror();
      state.histIndex = -1;
      state.histDraft = '';
      state.tabPrev = null;
      scrollToBottom();
      return;
    }

    // Tab autocomplete
    if (e.key === 'Tab') {
      e.preventDefault();
      const isDouble = state.tabPrev === input.value;
      const result = tabComplete(input.value, isDouble);
      state.tabPrev = result.listed ? null : result.newValue;
      if (result.newValue !== input.value) {
        input.value = result.newValue;
        updateMirror();
      }
      // Move caret to end
      setTimeout(() => { input.setSelectionRange(input.value.length, input.value.length); }, 0);
      return;
    }

    // Up arrow = back in history
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (state.history.length === 0) return;
      if (state.histIndex === -1) {
        state.histDraft = input.value;
        state.histIndex = state.history.length - 1;
      } else if (state.histIndex > 0) {
        state.histIndex--;
      }
      input.value = state.history[state.histIndex] || '';
      updateMirror();
      setTimeout(() => { input.setSelectionRange(input.value.length, input.value.length); }, 0);
      state.tabPrev = null;
      return;
    }

    // Down arrow = forward in history
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (state.histIndex === -1) return;
      if (state.histIndex < state.history.length - 1) {
        state.histIndex++;
        input.value = state.history[state.histIndex];
      } else {
        state.histIndex = -1;
        input.value = state.histDraft;
        state.histDraft = '';
      }
      updateMirror();
      setTimeout(() => { input.setSelectionRange(input.value.length, input.value.length); }, 0);
      state.tabPrev = null;
      return;
    }

    // Enter = execute
    if (e.key === 'Enter') {
      e.preventDefault();
      let cmd = input.value;
      const expanded = expandHistory(cmd);
      if (expanded === null) {
        renderPromptHistoryLine(cmd);
        appendHTML(`<span class="out-error">${esc(cmd)}: event not found</span>`);
        input.value = '';
        updateMirror();
        state.histIndex = -1;
        state.tabPrev = null;
        scrollToBottom();
        return;
      }
      if (expanded !== cmd) {
        // History expansion: show what's about to run, then run it
        renderPromptHistoryLine(expanded);
        cmd = expanded;
      } else {
        renderPromptHistoryLine(cmd);
      }

      // Add to history if non-empty and not duplicate of last
      const trimmed = cmd.trim();
      if (trimmed) {
        if (state.history[state.history.length - 1] !== trimmed) {
          state.history.push(trimmed);
          persistHistory();
        }
      }
      state.histIndex = -1;
      state.histDraft = '';
      state.tabPrev = null;

      try { dispatch(cmd); }
      catch (err) {
        appendHTML(`<span class="out-error">internal error: ${esc(err.message)}</span>`);
        console.error(err);
      }
      input.value = '';
      updateMirror();
      scrollToBottom();
      return;
    }

    // Any other key invalidates double-tab
    state.tabPrev = null;
  });

  function clearBootTimers() {

  function endBoot() {
    if (bootDone) return;
    bootDone = true;
    clearBootTimers();
    bootScreen.style.display = 'none';
    if (bootSkipHint) bootSkipHint.style.display = 'none';
    document.removeEventListener('keydown', skipBootHandler);
  }

  // Goes from anywhere to the menu screen

    endBoot();

  // Goes from menu (option 1) into the shell with MOTD

    focusInput();
    scrollToBottom();

  let menuInput = null;
  let menuMirrorBefore = null;
  let menuMirrorAfter = null;
  let menuCursor = null;

  function setupMenuInput() {
    menuInput = document.getElementById('menu-cmd-input');
    menuMirrorBefore = document.getElementById('menu-input-mirror-before');
    menuMirrorAfter = document.getElementById('menu-input-mirror-after');
    menuCursor = document.getElementById('menu-cursor');

    function updateMenuMirror() {
      const v = menuInput.value;
      const pos = menuInput.selectionStart != null ? menuInput.selectionStart : v.length;
      menuMirrorBefore.textContent = v.slice(0, pos);
      const charAt = v[pos] || '';
      menuCursor.setAttribute('data-char', charAt === ' ' ? '\u00a0' : charAt);
      menuMirrorAfter.textContent = v.slice(pos + 1);
    }

    menuInput.addEventListener('input', updateMenuMirror);
    menuInput.addEventListener('click', updateMenuMirror);
    menuInput.addEventListener('keyup', updateMenuMirror);

    function submitMenuOption() {
      const val = menuInput.value.trim();
      menuInput.value = '';
      updateMenuMirror();
      if (val === '') return;
      const n = parseInt(val, 10);
      if (isNaN(n) || !MENU_OPTIONS.some(o => o.n === n)) {
        showMenuError(`Invalid option: ${esc(val)}`);
        return;
      }
      executeMenuOption(n);
    }

    menuInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        submitMenuOption();
      }
    });

    // iOS numeric keypad "Done"/"OK" button doesn't fire Enter.
    // It blurs the input. We catch the blur and submit if value is set.
    menuInput.addEventListener('blur', () => {
      // Small delay so click on .m-option still works
      setTimeout(() => {
        if (menuInput.value.trim() !== '' && menuShown) {
          submitMenuOption();
        }
      }, 100);
    });

    // Auto-submit on input when value is unambiguous: any single digit 0-9
    // except '1' (which could be either '1' or '10').
    // After 200ms of no further input, submit anyway.
    let autoSubmitTimer = null;
    menuInput.addEventListener('input', () => {
      if (autoSubmitTimer) { clearTimeout(autoSubmitTimer); autoSubmitTimer = null; }
      const v = menuInput.value.trim();
      if (v === '') return;
      // If value is 2 digits (10) — submit immediately
      if (/^\d{2}$/.test(v)) {
        autoSubmitTimer = setTimeout(submitMenuOption, 80);
        return;
      }
      // If single digit but NOT '1' (which could become '10'), submit after short delay
      if (/^[02-9]$/.test(v)) {
        autoSubmitTimer = setTimeout(submitMenuOption, 350);
        return;
      }
      // If '1', wait longer in case user types another digit
      if (v === '1') {
        autoSubmitTimer = setTimeout(submitMenuOption, 700);
        return;
      }
    });

    // Keep focus — but not when overlay is open or click landed inside overlay
    menuScreen.addEventListener('click', (e) => {
      if (e.target.closest('.m-option')) return; // option click handled separately
      if (e.target.closest('#menu-output')) return; // overlay handles its own focus
      if (document.getElementById('menu-output')) return; // overlay is open
      menuInput.focus();
    });
  }

  function showMenuError(msg) {
    // Remove old error if any
    const old = menuContent.querySelector('.m-error');
    if (old) old.remove();
    const err = document.createElement('div');
    err.className = 'm-error';
    err.innerHTML = msg + ' <span class="out-dim">(try a number 0-10)</span>';
    menuContent.appendChild(err);
  }

  function executeMenuOption(n) {
    const opt = MENU_OPTIONS.find(o => o.n === n);
    if (!opt) return;

    if (opt.action === 'shell') {
      enterShell();
      return;
    }
    if (opt.action === 'reboot') {
      // Visual reboot: clear screen, show "rebooting...", then reload
      menuContent.innerHTML = '<div class="m-banner-line">rebooting rochaOS...</div>' +
        '<div class="m-info">unmounting filesystems · stopping services · halting kernel</div>';
      try { sessionStorage.removeItem('rochaOS:bootDone'); } catch (e) {}
      setTimeout(() => location.reload(), 900);
      return;
    }
    if (opt.action === 'external') {
      window.open(opt.url, '_blank', 'noopener');
      // Stay on menu
      return;
    }
    if (opt.action === 'cmd') {
      showMenuOutput(opt);
      return;
    }
  }

  // ─── MENU OUTPUT OVERLAY ──────────────────────────────────────────────────
  // Renders shell command output inside the menu, with back button.
  // Uses a temporary DOM swap so existing append* functions write into the overlay.
  function showMenuOutput(opt) {
    // Clear any previous overlay
    const existing = document.getElementById('menu-output');
    if (existing) existing.remove();

    const overlay = document.createElement('div');
    overlay.id = 'menu-output';
    overlay.className = 'is-open';
    overlay.innerHTML =
      '<div class="mo-header">' +
        '<span class="mo-title" id="mo-title">// option ' + opt.n + ' · ' + esc(opt.title) + '</span>' +
        '<span class="mo-cmd" id="mo-cmd">$ ' + esc(opt.cmd) + '</span>' +
        '<button class="mo-back" id="mo-back-btn">← back to menu</button>' +
      '</div>' +
      '<div class="mo-body" id="mo-body"></div>';
    menuContent.appendChild(overlay);

    const moBody = document.getElementById('mo-body');

    // Navigation stack: [{title, cmd, html}]
    const navStack = [];

    function renderCmd(title, cmd) {
      moBody.innerHTML = '';
      setOutputContainer(moBody);
      // Update header
      document.getElementById('mo-title').textContent = title;
      document.getElementById('mo-cmd').textContent = '$ ' + cmd;
      // Update back button label
      const backBtn = document.getElementById('mo-back-btn');
      backBtn.textContent = navStack.length > 0 ? '← back' : '← back to menu';
      try { dispatch(cmd); }
      catch (err) {
        appendHTML(`<span class="out-error">internal error: ${esc(err.message)}</span>`);
        console.error(err);
      }
      scrollToBottom();
    }

    // Disable menu input while overlay open
    if (menuInput) {
      menuInput.value = '';
      if (menuMirrorBefore) menuMirrorBefore.textContent = '';
      if (menuMirrorAfter) menuMirrorAfter.textContent = '';
      if (menuCursor) menuCursor.setAttribute('data-char', '');
      menuInput.blur();
      menuInput.disabled = true;
    }

    // Initial render
    renderCmd('// option ' + opt.n + ' · ' + opt.title, opt.cmd);

    function closeOverlay() {
      overlay.remove();
      clearOutputContainer();
      document.removeEventListener('keydown', escClose);
      if (menuInput) {
        menuInput.disabled = false;
        if (!window.matchMedia || !window.matchMedia('(max-width: 640px)').matches) {
          menuInput.focus();
        }
      }
    }

    // Back button: go to previous in stack, or close overlay
    document.getElementById('mo-back-btn').addEventListener('click', () => {
      if (navStack.length > 0) {
        const prev = navStack.pop();
        renderCmd(prev.title, prev.cmd);
      } else {
        closeOverlay();
      }
    });

    // Clickable links inside overlay: push current to stack, render new cmd
    overlay.addEventListener('click', (e) => {
      const link = e.target.closest('.cmd-link');
      if (link && link.dataset.cmd) {
        e.preventDefault();
        e.stopPropagation();
        navStack.push({
          title: document.getElementById('mo-title').textContent,
          cmd: document.getElementById('mo-cmd').textContent.replace(/^\$ /, ''),
        });
        if (navStack.length > 10) navStack.shift();
        renderCmd('// ' + link.dataset.cmd, link.dataset.cmd);
        return;
      }
      const projLink = e.target.closest('[data-project]');
      if (projLink) {
        e.preventDefault();
        e.stopPropagation();
        navStack.push({
          title: document.getElementById('mo-title').textContent,
          cmd: document.getElementById('mo-cmd').textContent.replace(/^\$ /, ''),
        });
        if (navStack.length > 10) navStack.shift();
        const cmd = `cat projects/${projLink.dataset.project}.md`;
        renderCmd('// ' + projLink.dataset.project, cmd);
        return;
      }
    });

    // Esc closes overlay
    function escClose(e) {
      if (e.key === 'Escape') {
        e.preventDefault();
        closeOverlay();
      }
    }
    document.addEventListener('keydown', escClose);

    // Scroll overlay into view
    overlay.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // Run a function while temporarily redirecting getOutputTarget().appendChild to a target container.
  // This lets us reuse all the dispatch/append* functions to write into a different DOM node.
  // Async-friendly output redirect: all append* go through this getter.
  // Stays in effect across setTimeout/animation callbacks until explicitly cleared.
  let outputContainer = null;  // null = use real history element

  function getOutputTarget() {
    return outputContainer || history;
  }

  function setOutputContainer(container) {
    outputContainer = container;
  }

  function clearOutputContainer() {
    outputContainer = null;
  }

  // Run a function with output redirected. Caller is responsible for calling
  // clearOutputContainer() when async work is done (e.g. on overlay close).
  function runIntoContainer(container, fn) {
    setOutputContainer(container);
    try { fn(); }
    catch (e) { clearOutputContainer(); throw e; }
    // Don't auto-clear — async work might still be running.
    // The caller (closeOverlay) clears it.
  }


  // ─── menu COMMAND (callable from shell) ──────────────────────────────────
  function cmdMenu() {
    showMenu();
  }

  // Track session start for live uptime
  const sessionStart = Date.now();

  function formatUptime(ms) {
    const s = Math.floor(ms / 1000);
    if (s < 60) return `${s}s`;
    const m = Math.floor(s / 60);
    if (m < 60) return `${m}m ${s % 60}s`;
    const h = Math.floor(m / 60);
    if (h < 24) return `${h}h ${m % 60}m`;
    const d = Math.floor(h / 24);
    return `${d}d ${h % 24}h`;
  }

  function showMOTD() {
    // Box width: characters between the two │ bars
    // On mobile use narrower box to avoid horizontal scroll
    const isMobile = window.matchMedia && window.matchMedia('(max-width: 640px)').matches;
    const W = isMobile ? 36 : 53;
    const indent = isMobile ? '' : '       ';

    // Helper: build a box line. content is plain text length used for padding;
    // contentHTML is the actual HTML to render inside the bars.
    // Strip HTML tags to compute visible character length.
    // Note: we count Unicode code points (including emoji like ●), not UTF-16 code units.
    function visibleLen(html) {
      const text = html.replace(/<[^>]*>/g, '');
      // Use Array.from to count code points correctly
      return Array.from(text).length;
    }

    // Auto-measured: just pass the HTML, we compute padding from visible chars
    function boxLine(contentHTML) {
      const plainLen = visibleLen(contentHTML);
      const pad = Math.max(0, W - plainLen);
      return indent +
        '<span class="out-info">│</span>' +
        contentHTML +
        ' '.repeat(pad) +
        '<span class="out-info">│</span>';
    }

    function boxBlank() {
      return indent +
        '<span class="out-info">│</span>' +
        ' '.repeat(W) +
        '<span class="out-info">│</span>';
    }

    function boxTop() {
      const fullTitle = '─[ rochaOS · 26.04 "Komaki Stable" ]';
      const shortTitle = '─[ rochaOS 26.04 ]';
      const title = (W >= fullTitle.length + 1) ? fullTitle : shortTitle;
      const fill = '─'.repeat(Math.max(1, W - title.length));
      return indent + '<span class="out-info">┌' + title + fill + '┐</span>';
    }

    function boxBottom() {
      return indent + '<span class="out-info">└' + '─'.repeat(W) + '┘</span>';
    }

    appendHTML(boxTop());
    appendHTML(boxBlank());

    // Logo: use simpler ASCII on mobile (block-drawing chars don't render
    // mono-width in iOS Safari fallback fonts and break alignment)
    if (isMobile) {
      // Simple, mono-safe text logo
      appendHTML(boxLine('   <span class="out-accent">[ R O C H A ]</span>'));
    } else {
      // Desktop block-style logo
      appendHTML(boxLine('   <span class="out-accent">██▀▄  ▄▀▀▄ ▄▀▀▄ █  █ ▄▀▀▄</span>'));
      appendHTML(boxLine('   <span class="out-accent">█▀▄   █  █ █    ████ █▀▀█</span>'));
      appendHTML(boxLine('   <span class="out-accent">▀  ▀  ▀▀   ▀▀▀▀ █  █ ▀  ▀</span>'));
    }
    appendHTML(boxBlank());

    // Live session uptime line — placeholder we'll keep updating
    const upDiv = document.createElement('div');
    upDiv.className = 'line';
    upDiv.id = 'motd-uptime';
    getOutputTarget().appendChild(upDiv);
    function renderUp() {
      const up = formatUptime(Date.now() - sessionStart);
      const content = isMobile
        ? ' <span class="out-dim">session: </span> <span class="out-exec">' + esc(up) + '</span>'
        : '   <span class="out-dim">session:   </span><span class="out-exec">' + esc(up) + '</span>';
      upDiv.innerHTML = boxLine(content);
    }
    renderUp();
    setInterval(renderUp, 1000);

    if (isMobile) {
      // Compact mobile content
      appendHTML(boxLine(' <span class="out-dim">homelab: </span><span class="out-exec">847d · 0 incidents</span>'));
      appendHTML(boxLine(' <span class="out-dim">location:</span> komaki, jp'));
      appendHTML(boxLine(' <span class="out-dim">status:  </span><span class="out-exec">● connections open</span>'));
      appendHTML(boxBlank());
      appendHTML(boxLine(' <span class="out-dim">"poetry that doesn\'t rhyme</span>'));
      appendHTML(boxLine(' <span class="out-dim"> but never falls down."</span>'));
    } else {
      // Desktop content
      appendHTML(boxLine('   <span class="out-dim">homelab:   </span><span class="out-exec">847 days · 0 incidents</span> <span class="out-faint">(real)</span>'));
      appendHTML(boxLine('   <span class="out-dim">location:  </span>komaki, japan <span class="out-faint">· 35.29°N 136.92°E</span>'));
      appendHTML(boxLine('   <span class="out-dim">status:    </span><span class="out-exec">● accepting connections</span>'));
      appendHTML(boxBlank());
      appendHTML(boxLine('   <span class="out-dim">"infrastructure is poetry that doesn\'t</span>'));
      appendHTML(boxLine('   <span class="out-dim"> rhyme but never falls down."</span>'));
    }

    appendHTML(boxBlank());
    appendHTML(boxBottom());
    appendBlank();
    appendHTML('<span class="out-dim">Last login: from an unknown timezone</span>');
    appendHTML('<span class="out-dim">type </span><span class="cmd-link" data-cmd="help">help</span><span class="out-dim"> for commands · </span><span class="cmd-link" data-cmd="whoami">whoami</span><span class="out-dim"> · </span><span class="cmd-link" data-cmd="resume">resume</span><span class="out-dim"> · </span><span class="cmd-link" data-cmd="hire">hire</span>');
    appendBlank();
  }

  })();
  </script>
